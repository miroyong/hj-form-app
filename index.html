<style>
  :root {

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: var(--fundo); color: #202124; }
  header { background: var(--azul); color: #fff; padding: 18px 20px; }
  header h1 { font-size: 20px; font-weight: 600; }
  header p { font-size: 13px; opacity: .9; margin-top: 4px; }
  main { max-width: 760px; margin: 20px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--borda); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; color: var(--cinza); font-weight: 600; margin-bottom: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .campo { margin-bottom: 18px; }
  .campo label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .campo .desc { font-size: 12px; color: var(--cinza); margin-bottom: 6px; white-space: pre-line; }
  .campo input[type=text], .campo input[type=time], .campo select, .campo textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--borda); border-radius: 8px;
    font-size: 14px; background: #fff; font-family: inherit;

  .campo textarea { min-height: 70px; resize: vertical; }
  .campo input:focus, .campo select:focus, .campo textarea:focus { outline: 2px solid var(--azul); outline-offset: -1px; }
  .radios { display: flex; flex-direction: column; gap: 8px; }
  .radio-item { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--borda); border-radius: 8px; cursor: pointer; font-size: 14px; }
  .radio-item:hover { background: #f1f6fe; }
  .radio-item input { accent-color: var(--azul); width: 18px; height: 18px; }
  .modo-botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 8px; }
  .modo-btn { padding: 16px 12px; border: 2px solid var(--borda); border-radius: 10px; background: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; transition: all .15s; }
  .modo-btn.ativo { border-color: var(--azul); background: #e8f0fe; color: var(--azul-escuro); }
  .modo-btn:hover { border-color: var(--azul); }
  .secao-titulo { font-size: 16px; font-weight: 700; color: var(--azul-escuro); border-left: 4px solid var(--azul);
    padding: 6px 12px; background: #e8f0fe; border-radius: 4px; margin: 4px 0 16px; }
  .aviso-upload { background: #fef7e0; border: 1px solid #f9ab00; border-radius: 8px; padding: 12px; font-size: 13px; }
  .aviso-upload a { color: var(--azul); }
  .acoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .btn { padding: 11px 18px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-primario { background: var(--azul); color: #fff; }
  .btn-primario:hover { background: var(--azul-escuro); }
  .btn-secundario { background: #fff; color: var(--azul); border: 1px solid var(--borda); }
  .btn-secundario:hover { border-color: var(--azul); }
  .btn-perigo { background: #fff; color: #d93025; border: 1px solid var(--borda); }
  .btn-pequeno { padding: 6px 10px; font-size: 12px; }
  .status { margin-top: 14px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
  .status.ok { display: block; background: #e6f4ea; color: var(--verde); border: 1px solid #34a853; }
  .status.erro { display: block; background: #fce8e6; color: #d93025; border: 1px solid #ea4335; }
  .status.info { display: block; background: #e8f0fe; color: var(--azul-escuro); border: 1px solid var(--azul); }
  .reg { border: 1px solid var(--borda); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: #fff; }
  .reg-topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; cursor: pointer; }
  .reg-nome { font-weight: 600; font-size: 14px; }
  .reg-meta { font-size: 12px; color: var(--cinza); margin-top: 2px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .badge.enviado { background: #e6f4ea; color: var(--verde); }
  .badge.pendente { background: #fef7e0; color: #b06000; }
  .reg-detalhe { display: none; margin-top: 10px; border-top: 1px dashed var(--borda); padding-top: 10px; font-size: 13px; }
  .reg-detalhe.aberto { display: block; }
  .reg-detalhe table { width: 100%; border-collapse: collapse; }
  .reg-detalhe td { padding: 4px 6px; border-bottom: 1px solid #f1f3f4; vertical-align: top; }
  .reg-detalhe td:first-child { color: var(--cinza); width: 40%; }
  .reg-acoes { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .busca { width: 100%; padding: 10px 12px; border: 1px solid var(--borda); border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
  .vazio { color: var(--cinza); font-size: 13px; text-align: center; padding: 20px 0; }
  .rodape { text-align: center; color: var(--cinza); font-size: 12px; padding: 20px; }
  .resultado-contador { font-size: 12px; color: var(--cinza); margin-bottom: 8px; }
</style>

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function escAttr(s) { return esc(s); }

function renderizarModo() {
  const el = document.getElementById('campos-modo');
  const comuns = document.getElementById('campos-comuns');
  comuns.innerHTML = comum.map(campoHTML).join('');
  if (!modoAtual) {
    el.innerHTML = '<div class="vazio">Escolha acima: cadastro de novo convidado ou atualização de convidado.</div>';
    qsAtuais = []; uploads = [];
    return;
  }
  const grupo = modoAtual === 'novo' ? novo : atualizacao;
  qsAtuais = grupo.filter(p => p.tipo !== 'arquivo');
  uploads = grupo.filter(p => p.tipo === 'arquivo');
  const titulo = modoAtual === 'novo' ? '🆕 Novo Convidado' : '🔄 Atualização de Convidado';
  el.innerHTML = '<div class="secao-titulo">' + titulo + '</div>' + grupo.map(campoHTML).join('');
}

function valorDaPergunta(p) {
  const t = tipoTexto(p);
  const id = 'q-' + p.entry_id;
  if (t === 'radio') {
    const r = document.querySelector('input[name="' + id + '"]:checked');
    if (!r) return null;
    const label = r.getAttribute('data-label');
    return { enviar: r.value, label: label };
  }
  const el = document.getElementById(id);
  if (!el) return null;
  const v = el.value.trim();
  if (!v) return null;
  return { enviar: v, label: v };
}

function coletarDados() {
  const dados = [];
  for (const p of comum.concat(qsAtuais)) {
    const v = valorDaPergunta(p);
    if (v) dados.push({ p, enviar: v.enviar, label: v.label });
  }
  return dados;
}

function nomeDoRegistro(dados) {
  const nomeQ = modoAtual === 'novo'
    ? FORM.perguntas.find(p => p.entry_id === 257749101)
    : FORM.perguntas.find(p => p.entry_id === 1384483445);
  const d = dados.find(x => x.p.entry_id === nomeQ.entry_id);
  return d ? d.label : '(sem nome)';
}

function enviarFormulario() {
  const dados = coletarDados();
  if (modoAtual !== 'novo' && modoAtual !== 'atualizacao') {
    mostrarStatus('Escolha o tipo de registro (Novo Convidado ou Atualização).', 'erro');
    return;
  }
  if (!dados.length) { mostrarStatus('Preencha pelo menos um campo.', 'erro'); return; }
  // sempre envia o seletor de modo
  const modoVal = seletor.opcoes.find(o => o.label.includes(modoAtual === 'novo' ? 'Novo convidado' : 'Atualização de convidado'));
  const form = document.getElementById('hj-post');
  form.action = SUBMIT_URL;
  form.innerHTML = '';
  if (modoVal) {
    const inp = document.createElement('input');
    inp.name = 'entry.' + seletor.entry_id;
    inp.value = String(modoVal.valor_id != null ? modoVal.valor_id : modoVal.label);
    form.appendChild(inp);
  }
  for (const d of dados) {
    const inp = document.createElement('input');
    inp.name = 'entry.' + d.p.entry_id;
    inp.value = d.enviar;
    form.appendChild(inp);
  }
  form.submit();

  const reg = {
    id: Date.now(), ts: new Date().toISOString(), modo: modoAtual,
    nome: nomeDoRegistro(dados),
    dados: dados.map(d => ({ pergunta: d.p.titulo, valor: d.label })),
    uploadsPendentes: uploads.length,
    status: uploads.length ? 'pendente' : 'enviado'
  };
  salvarRegistro(reg);
  mostrarStatus(
    (reg.status === 'pendente' ? 'Enviado ao Google (sem os arquivos).' : 'Enviado ao Google Form com sucesso!') +
    (reg.uploadsPendentes ? ' Anexe o PDF pelo botão "Abrir no Google pré-preenchido".' : ''),
    reg.status === 'pendente' ? 'info' : 'ok'
  );
}

function prefillGoogle() {
  const dados = coletarDados();
  const params = new URLSearchParams();
  const modoVal = seletor.opcoes.find(o => o.label.includes(modoAtual === 'novo' ? 'Novo convidado' : 'Atualização de convidado'));
  if (modoVal) params.set('entry.' + seletor.entry_id, String(modoVal.valor_id != null ? modoVal.valor_id : modoVal.label));
  for (const d of dados) params.set('entry.' + d.p.entry_id, d.enviar);
  window.open(VIEW_URL + (params.toString() ? '?' + params.toString() : ''), '_blank');
}

function mostrarStatus(msg, tipo) {
  const el = document.getElementById('status');
  el.className = 'status ' + tipo;
  el.textContent = msg;
  clearTimeout(mostrarStatus._t);
  mostrarStatus._t = setTimeout(() => { el.className = 'status'; }, 8000);
}

function limparCampos() {
  document.querySelectorAll('#campos-comuns input, #campos-comuns select, #campos-comuns textarea,' +
    '#campos-modo input, #campos-modo select, #campos-modo textarea').forEach(el => {
    if (el.type === 'radio') el.checked = false; else el.value = '';
  });
}

// ---------- histórico ----------
function getRegistros() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
}
function salvarRegistro(reg) {
  const lista = getRegistros();
  lista.unshift(reg);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
  renderizarHistorico();
}

function renderizarHistorico(filtro) {
  const lista = getRegistros();
  const cont = document.getElementById('resultado-contador');
  document.getElementById('qtd-registros').textContent = lista.length ? '(' + lista.length + ')' : '';
  if (!lista.length) {
    document.getElementById('lista-registros').innerHTML = '<div class="vazio">Nenhum registro ainda.</div>';
    cont.textContent = '';
    return;
  }
  let items = lista;
  if (filtro) {
    const f = filtro.toLowerCase();
    items = items.filter(r => (r.nome + ' ' + r.modo + ' ' + r.dados.map(d => d.pergunta + ' ' + d.valor).join(' ')).toLowerCase().includes(f));
  }
  cont.textContent = items.length + (items.length === 1 ? ' registro' : ' registros') + (filtro ? ' (filtrado)' : '');
  document.getElementById('lista-registros').innerHTML = items.map(r => {
    const detalhe = r.dados.map(d => '<tr><td>' + esc(d.pergunta) + '</td><td>' + esc(d.valor) + '</td></tr>').join('');
    return '<div class="reg">' +
      '<div class="reg-topo" data-toggle="1">' +
        '<div><div class="reg-nome">' + esc(r.nome) + '</div>' +
        '<div class="reg-meta">' + esc(r.modo === 'novo' ? '🆕 Novo Convidado' : '🔄 Atualização') + ' · ' + new Date(r.ts).toLocaleString('pt-BR') + '</div></div>' +
        '<span class="badge ' + (r.status === 'enviado' ? 'enviado' : 'pendente') + '">' + (r.status === 'enviado' ? '✓ enviado' : '⚠ upload pendente') + '</span>' +
      '</div>' +
      '<div class="reg-detalhe"><table>' + detalhe + '</table>' +
        '<div class="reg-acoes">' +
          '<button class="btn btn-secundario btn-pequeno" data-recarregar="' + r.id + '">Carregar no formulário</button>' +
          '<button class="btn btn-perigo btn-pequeno" data-excluir="' + r.id + '">Excluir</button>' +
        '</div></div>' +
    '</div>';
  }).join('');
}

document.getElementById('lista-registros').addEventListener('click', (ev) => {
  const topo = ev.target.closest('[data-toggle]');
  if (topo) {
    topo.parentElement.querySelector('.reg-detalhe').classList.toggle('aberto');
    return;
  }
  const btnExcluir = ev.target.closest('[data-excluir]');
  const btnRecarregar = ev.target.closest('[data-recarregar]');
  if (btnExcluir) {
    const id = Number(btnExcluir.dataset.excluir);
    if (confirm('Excluir este registro?')) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(getRegistros().filter(r => r.id !== id)));
      renderizarHistorico(document.getElementById('busca').value);
    }
  }
  if (btnRecarregar) {
    const id = Number(btnRecarregar.dataset.recarregar);
    const reg = getRegistros().find(r => r.id === id);
    if (reg) carregarRegistro(reg);
  }
});

function carregarRegistro(reg) {
  setModo(reg.modo);
  // aplica por label/valor
  for (const d of reg.dados) {
    const p = FORM.perguntas.find(x => x.titulo === d.pergunta);
    if (!p) continue;
    const t = tipoTexto(p);
    const id = 'q-' + p.entry_id;
    if (t === 'radio') {
      const r = document.querySelector('input[name="' + id + '"][data-label="' + escAttr(d.valor) + '"]');
      if (r) r.checked = true;
    } else {
      const el = document.getElementById(id);
      if (el) el.value = d.valor;
    }
  }
  document.getElementById('card-form').scrollIntoView({ behavior: 'smooth' });
  mostrarStatus('Registro carregado no formulário. Ajuste e envie.', 'info');
}

function setModo(m) {
  modoAtual = m;
  document.querySelectorAll('.modo-btn').forEach(b => b.classList.toggle('ativo', b.dataset.modo === m));
  renderizarModo();
}

// ---------- CSV ----------
function exportarCSV() {
  const lista = getRegistros();
  if (!lista.length) { alert('Nenhum registro para exportar.'); return; }
  const titulos = ['Data', 'Tipo', 'Nome'];
  const conjunto = new Set();
  for (const r of lista) for (const d of r.dados) conjunto.add(d.pergunta);
  const perguntas = [...conjunto];
  const linhas = lista.map(r => {
    const mapa = Object.fromEntries(r.dados.map(d => [d.pergunta, d.valor]));
    return [new Date(r.ts).toLocaleString('pt-BR'), r.modo === 'novo' ? 'Novo' : 'Atualização', r.nome]
      .concat(perguntas.map(p => mapa[p] || ''));
  });
  const csv = [titulos.concat(perguntas), ...linhas]
    .map(l => l.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';'))
    .join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'registros-hj.csv';
  a.click();
}

// ---------- eventos ----------
document.getElementById('modo-botoes').addEventListener('click', (ev) => {
  const btn = ev.target.closest('.modo-btn');
  if (btn) setModo(btn.dataset.modo);
});
document.getElementById('btn-enviar').addEventListener('click', enviarFormulario);
document.getElementById('btn-prefill').addEventListener('click', prefillGoogle);
document.getElementById('btn-limpar').addEventListener('click', () => { limparCampos(); mostrarStatus('Formulário limpo.', 'info'); });
document.getElementById('btn-csv').addEventListener('click', exportarCSV);
document.getElementById('btn-apagar-tudo').addEventListener('click', () => {
  if (confirm('Apagar TODOS os registros salvos?')) {
    localStorage.removeItem(STORAGE_KEY);
    renderizarHistorico();
  }
});
document.getElementById('busca').addEventListener('input', (ev) => renderizarHistorico(ev.target.value));

setModo(null);
renderizarHistorico();
</script>
